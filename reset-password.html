<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — SURAJTRADERX</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/jpeg" href="assets/srtx-logo.jpg">
<style>
.auth-wrap{min-height:70vh;display:grid;place-items:center;padding:40px 16px;background:linear-gradient(135deg,#f7f9ff,#eef2ff)}
.auth-card{width:min(480px,100%);background:#fff;border:1px solid #e3e8f2;border-radius:26px;padding:28px;box-shadow:0 20px 60px rgba(30,50,100,.10)}
.auth-card h1{margin:12px 0 8px}.auth-msg{display:none;margin:14px 0;padding:13px 15px;border-radius:13px;line-height:1.5;font-size:14px}.auth-msg.show{display:block}.auth-msg.error{background:#fff1f2;border:1px solid #fecdd3;color:#b42318}.auth-msg.success{background:#ecfdf3;border:1px solid #b7ebca;color:#087443}.small-note{color:#667085;font-size:13px;line-height:1.5;margin-top:12px}.back-link{display:inline-block;margin-top:20px}
</style>
</head>
<body>
<div class="topbar">SURAJTRADERX • Secure Password Recovery</div>
<main class="auth-wrap">
  <div class="auth-card">
    <span class="tag">Password recovery</span>
    <h1>Set a new password.</h1>
    <p class="lead">Choose a new password for your SURAJTRADERX account.</p>
    <div id="msg" class="auth-msg"></div>
    <form id="resetForm" class="form">
      <div class="field"><label>New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></div>
      <div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat password"></div>
      <button id="saveBtn" class="btn btn-blue" type="submit">Update Password</button>
    </form>
    <p class="small-note">After updating, you will be taken back to the student login page.</p>
    <a class="back-link" href="login.html">← Back to login</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb=window.supabase.createClient(SRTX_CONFIG.SUPABASE_URL,SRTX_CONFIG.SUPABASE_ANON_KEY);
const msg=document.getElementById('msg');
function show(type,text){msg.className='auth-msg show '+type;msg.textContent=text}
let ready=false;
async function checkRecovery(){
  const {data,error}=await sb.auth.getSession();
  if(error){show('error',error.message);return}
  if(data.session){ready=true;return}
  show('error','This password reset link is expired or invalid. Request a new reset link from the login page.');
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){ready=true;show('success','Recovery link verified. Enter your new password.');}
});
checkRecovery();
document.getElementById('resetForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!ready){await checkRecovery();if(!ready)return}
  const p=document.getElementById('password').value;const c=document.getElementById('confirm').value;
  if(p!==c){show('error','Passwords do not match.');return}
  if(p.length<8){show('error','Password must be at least 8 characters.');return}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Updating…';
  const {error}=await sb.auth.updateUser({password:p});
  if(error){show('error','Could not update password: '+error.message);btn.disabled=false;btn.textContent='Update Password';return}
  show('success','Password updated successfully. Redirecting to login…');
  setTimeout(async()=>{await sb.auth.signOut();location.href='login.html';},1200);
});
</script>
</body>
</html>
